version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: address-api-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - address-api-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: address-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - GEOCODING_API_URL=${GEOCODING_API_URL:-https://geocoding.geo.census.gov/geocoder/locations/address}
      - GEOCODING_API_KEY=${GEOCODING_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TLS=${REDIS_TLS:-false}
      - REDIS_TTL=${REDIS_TTL:-3600}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL:-60}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-false}
      - CORS_METHODS=${CORS_METHODS:-GET,HEAD,PUT,PATCH,POST,DELETE}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE=${CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE:-50}
      - CIRCUIT_BREAKER_TIMEOUT=${CIRCUIT_BREAKER_TIMEOUT:-10000}
      - CIRCUIT_BREAKER_RESET_TIMEOUT=${CIRCUIT_BREAKER_RESET_TIMEOUT:-30000}
      - CIRCUIT_BREAKER_ROLLING_WINDOW=${CIRCUIT_BREAKER_ROLLING_WINDOW:-10000}
    env_file:
      - .env
    # Uncomment volumes below for development mode with hot reload
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/dist
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - address-api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
    driver: local

networks:
  address-api-network:
    driver: bridge
